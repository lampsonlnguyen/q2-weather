name: Build and release Q2 Weather

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test
        run: |
          make clean
          make check
      - name: Package development sources
        run: |
          mkdir -p dist/q2-weather-source/src dist/q2-weather-source/tests
          cp src/weather.c src/weather.h dist/q2-weather-source/src/
          cp tests/test_weather.c dist/q2-weather-source/tests/
          cp Makefile README.md dist/q2-weather-source/
          ( cd dist && zip -qr q2-weather-source.zip q2-weather-source )
          unzip -t dist/q2-weather-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: q2-weather-development-source
          path: dist/q2-weather-source.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: q2-weather-development-source
          path: dist
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/q2-weather-source.zip \
            --verify-tag --prerelease --generate-notes \
            --title "$RELEASE_TAG (development sources)" \
            --notes "Development-only source snapshot. Not installable on Q2; native device networking and UI are not yet implemented."
