name: Build and release Q2 Weather

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q2-weather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format lld make gcc libcurl4-openssl-dev \
            squashfs-tools unzip zip curl xz-utils binutils file python3-pil fonts-dejavu-core
      - name: Verify C formatting
        run: |
          clang-format -i src/*.c src/*.h tests/*.c
          clang-format --dry-run --Werror src/*.c src/*.h tests/*.c
      - name: Run host checks
        run: make check
      - name: Build single Q2 Weather app
        run: |
          sh tools/sysroot.sh
          make
          test "$(find assets/sprites -maxdepth 1 -name '*.png' | wc -l)" -eq 15
          ! grep -q 'weather_glyph' src/dashboard_render.c
          unzip -t dist/q2-weather.zip
          unzip -l dist/q2-weather.zip | grep '.weather/icon.png'
          unzip -p dist/q2-weather.zip .weather/q2app | grep -Fx 'game=1'
          unzip -p dist/q2-weather.zip .weather/q2app | grep -Fx 'row=library'
          test "$(unzip -Z1 dist/q2-weather.zip | grep -c '/q2app$')" -eq 1
          ! unzip -Z1 dist/q2-weather.zip | grep -q '^.weather-view/'
          file dist/.weather/q2-weather | grep -E 'ELF 32-bit LSB.*MIPS'
          file dist/.weather/q2-weather-service | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v4
        with:
          name: q2-weather-card-app
          path: dist/q2-weather.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: q2-weather-card-app
          path: dist
      - name: Publish tagged Q2 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/q2-weather.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/q2-weather.zip \
              --verify-tag --prerelease --generate-notes \
              --title "$RELEASE_TAG (device test)"
          fi

  publish_weather_v060:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: q2-weather-card-app
          path: dist
      - name: Publish v0.6.0 Weather integration beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view v0.6.0 >/dev/null 2>&1; then
            echo 'v0.6.0 already exists; leaving published version unchanged'
            exit 0
          fi
          gh release create v0.6.0 dist/q2-weather.zip \
            --target "$TARGET_SHA" \
            --title "Q2 Weather v0.6.0 beta — iPod UI and native keyboard integration" \
            --notes "Beta: Q2 system themes (Minimal/Classic/Modern and their accents), iPod-inspired contrast, centered header, rounded-screen-safe layout, system wheel sensitivity and editable language packs. Removes custom keyboard and uses firmware native T9 via a Weather-specific handoff. Smart Wi-Fi wake/idle integration is in lampsonlnguyen/q2-pod main, which must be built and installed separately; existing Q2 Pod firmware will show an update prompt for city entry. Single Library Weather app, no extra graphics runtime. Hardware validation of the firmware bridge is still required."
