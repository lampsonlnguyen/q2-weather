name: Build and release Q2 Weather

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q2-weather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format lld make gcc libcurl4-openssl-dev \
            squashfs-tools unzip zip curl xz-utils binutils file python3-pil
      - name: Normalize C formatting
        run: |
          clang-format -i src/*.c src/*.h tests/*.c
          clang-format --dry-run --Werror src/*.c src/*.h tests/*.c
      - name: Run host checks
        run: make check
      - name: Build Shanling Q2 executable
        run: |
          sh tools/sysroot.sh
          make
          unzip -t dist/q2-weather.zip
          unzip -l dist/q2-weather.zip | grep '.weather/icons/sunny.jpg'
          unzip -l dist/q2-weather.zip | grep '.weather/icon.png'
          unzip -p dist/q2-weather.zip .weather/q2app | grep -Fx 'row=library'
          file dist/.weather/q2-weather | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v4
        with:
          name: q2-weather-card-app
          path: dist/q2-weather.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: q2-weather-card-app
          path: dist
      - name: Publish Q2 release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/q2-weather.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/q2-weather.zip \
              --verify-tag --prerelease --generate-notes \
              --title "$RELEASE_TAG (device test)"
          fi

  publish_graphics:
    # One-time v0.2.0 release from a green main build. Future pushes do not
    # replace published artifacts; subsequent versions use the tag workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: q2-weather-card-app
          path: dist
      - name: Publish native weather artwork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo 'v0.2.0 already published; not replacing it.'
            exit 0
          fi
          gh release create v0.2.0 dist/q2-weather.zip \
            --target "$TARGET_SHA" --title "Q2 Weather v0.2.0" \
            --notes "Adds tiny pixel-weather sprites to Q2 Pod native Library rows, a launcher icon, and a seven-day illustrated forecast. Preserves IP location, Open-Meteo, offline cache, native Q2 wheel and firmware themes. Weather artwork requires the card-app art capability (older firmware falls back to text). On-device visual rendering is pending hardware testing."
